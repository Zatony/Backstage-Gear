services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: backstagegear
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_USER: user
      DB_PASSWORD: password
      DATABASE: backstagegear
      DB_PORT: "3306"
      JWT_SECRET: supersecret
      UPLOAD_DIR_NAME: /usr/src/app/uploads
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data: